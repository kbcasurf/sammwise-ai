version: "3.7"

services:
    nextjs:
        build:
            context: .
            dockerfile: docker/Dockerfile
        restart: unless-stopped
        environment:
            - DATABASE_PATH=/app/data/sammwise.sqlite
            - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY:-}
            - AI_PROVIDER_API_URL=${AI_PROVIDER_API_URL:-}
            - AI_PROVIDER_API_FORMAT=${AI_PROVIDER_API_FORMAT:-openai}
            - AI_PROVIDER_MODEL=${AI_PROVIDER_MODEL:-}
            - AI_PROVIDER_TIMEOUT_MS=${AI_PROVIDER_TIMEOUT_MS:-60000}
            - AI_PROVIDER_MAX_TOKENS=${AI_PROVIDER_MAX_TOKENS:-2000}
            - AI_PROVIDER_EXTRA_BODY=${AI_PROVIDER_EXTRA_BODY:-{}}
        volumes:
            - sammwise-data:/app/data
        networks:
            - samm-network
        ports:
            - "127.0.0.1:3000:3000"

networks:
    samm-network:
        driver: bridge

volumes:
    sammwise-data:
