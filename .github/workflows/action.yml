name: Build and push docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: sammwise:scan

      # Deliberately scans both OS packages and application libraries (not vuln-type: os
      # only): the postcss/sharp HIGH findings here are the same accepted, upstream-only-fixable
      # debt that the npm-audit job reports (see ci.yml). Unlike npm-audit, this gate blocks
      # image publishing on them until Next.js updates its bundled postcss/sharp -- an explicit,
      # accepted tradeoff, not an oversight. Do not add --ignore-unfixed or a .trivyignore for
      # these specific findings without a fresh decision from the project owner.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sammwise:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sammwise:latest
