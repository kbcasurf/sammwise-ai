name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (report-only)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --config=p/nextjs \
            --config=p/dockerfile \
            --sarif-output=semgrep-results.sarif
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

      - name: Fail on high/critical Semgrep findings
        run: python3 .github/scripts/check-semgrep-severity.py semgrep-results.sarif

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (pull request diff scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified,unknown
      - name: TruffleHog (full history scan)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3.37.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3.37.2

      - name: Fail on open high/critical CodeQL findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-codeql-alerts.sh "${{ github.repository }}" "${{ github.ref }}"

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Start app in background
        run: |
          DATABASE_PATH=./data/sammwise.sqlite npm run start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then
              echo "App is up after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond within timeout" >&2
          exit 1
      - name: Dump app log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/app.log" || true
      - name: ZAP Baseline Scan (report-only)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:3000'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-report'
          docker_name: 'ghcr.io/zaproxy/zaproxy:2.17.0'

      - name: Fail on high/critical ZAP findings
        run: python3 .github/scripts/check-zap-severity.py report_json.json
